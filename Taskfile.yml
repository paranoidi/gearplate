# Build STLs from the presets in gearplate.json (OpenSCAD Customizer parameter sets).
#   task                 all presets -> out/<preset>.stl (skips up-to-date ones)
#   task stl P=2x3       one preset (from gearplate.json, bracket.json, stacking.json or snap.json)
#   task assembly        plate + caps + device fit check -> out/assembly.3mf/.png
#   task device          interactive (device.sh): size, cap cutouts, plate margins, wire slots -> devices/<name>/
#   task edit-device [D=switch]  same questions for an existing device, saved answers as defaults
#   task device:check D=switch  plate size + hole map (slot indices) for one device, no geometry
#   task device:build D=switch rebuild one device from devices/switch/switch.json (hand-editable)
#   task custom NAME=4x2 ARGS='-D cells_x=4 -D cells_y=2'
#   task test            logic checks (and spec.py)
#   task setup           fetch latest OpenSCAD nightly + BOSL2 into .tools/ (used automatically)
version: '3'

vars:
  # $OPENSCAD env > .tools nightly (Manifold backend, ~10x faster) > system openscad
  OPENSCAD:
    sh: |
      if [ -n "$OPENSCAD" ]; then echo "$OPENSCAD"
      elif [ -x .tools/openscad ]; then echo ".tools/openscad --backend=Manifold"
      else echo openscad; fi
  PRESETS:
    sh: jq -r '.parameterSets | keys[]' gearplate.json
  BRACKET_PRESETS:
    sh: jq -r '.parameterSets | keys[]' bracket.json
  STACKING_PRESETS:
    sh: jq -r '.parameterSets | keys[]' stacking.json
  SNAP_PRESETS:
    sh: jq -r '.parameterSets | keys[]' snap.json
  DEVICES:
    sh: ls devices 2>/dev/null || true

env:
  # searched before the user library dir, so .tools BOSL2 wins when present
  OPENSCADPATH: '{{.ROOT_DIR}}/.tools/libraries'

tasks:
  default:
    deps: [build]

  build:
    desc: Build all presets
    deps:
      - for: { var: PRESETS }
        task: stl
        vars: { P: '{{.ITEM}}' }
      - for: { var: BRACKET_PRESETS }
        task: stl
        vars: { P: '{{.ITEM}}' }
      - for: { var: STACKING_PRESETS }
        task: stl
        vars: { P: '{{.ITEM}}' }
      - for: { var: SNAP_PRESETS }
        task: stl
        vars: { P: '{{.ITEM}}' }
      - for: { var: DEVICES }
        task: device:build
        vars: { D: '{{.ITEM}}' }
      - assembly

  stl:
    desc: Build one preset (P=<name>)
    label: stl-{{.P}}
    requires: { vars: [P] }
    vars:
      # model = whichever preset file defines P
      F:
        sh: |
          if jq -e '.parameterSets["{{.P}}"]' bracket.json >/dev/null; then echo bracket
          elif jq -e '.parameterSets["{{.P}}"]' stacking.json >/dev/null; then echo stacking
          elif jq -e '.parameterSets["{{.P}}"]' snap.json >/dev/null; then echo snap
          else echo gearplate; fi
    preconditions:
      - sh: jq -e '.parameterSets["{{.P}}"]' {{.F}}.json >/dev/null
        msg: 'No preset "{{.P}}" in gearplate.json, bracket.json, stacking.json or snap.json'
    method: checksum  # not timestamp: its state is per task name, shared by all presets
    sources: ['{{.F}}.scad', '{{.F}}.json', opengrid-snap.scad, opengrid-tile.scad, .tools/openscad.version]
    generates: ['out/{{.P}}.stl']
    cmds:
      - mkdir -p out
      - '{{.OPENSCAD}} -p {{.F}}.json -P {{.P}} -o out/{{.P}}.stl {{.F}}.scad'

  assembly:
    desc: Build the fit-check assembly (3MF, one object per part, plus a coloured PNG)
    method: checksum
    sources: [assembly.scad, gearplate.scad, bracket.scad, opengrid-snap.scad, .tools/openscad.version]
    generates: [out/assembly.3mf, out/assembly.png]
    cmds:
      - mkdir -p out
      # lazy-union: no implicit top-level union, so the slicer gets separate objects
      - '{{.OPENSCAD}} --enable=lazy-union -o out/assembly.3mf assembly.scad'
      # preview mode keeps the colours (an STL can't)
      - '{{.OPENSCAD}} -o out/assembly.png --imgsize=1000,800 --viewall --autocenter --camera=0,0,0,55,0,25,0 assembly.scad'

  device:
    desc: 'Interactive: name a device, enter its size, cap cutouts, plate margins and wire slots, build it'
    interactive: true
    silent: true
    env: { TASK_EXE: '{{.TASK_EXE}}' }
    cmds: [bash device.sh]

  edit-device:
    desc: 'Interactive: edit an existing device (D=<name> or asked); every answer defaults to its saved value'
    interactive: true
    silent: true
    env: { TASK_EXE: '{{.TASK_EXE}}' }
    cmds: ['bash device.sh --edit {{.D}}']

  edit-*:
    desc: 'Interactive: edit one section of an existing device (D=<name> or asked): edit-size, edit-cap-a, edit-cap-b, edit-margin, edit-slots'
    interactive: true
    silent: true
    vars: { S: '{{index .MATCH 0}}' }
    env: { TASK_EXE: '{{.TASK_EXE}}' }
    cmds: ['bash device.sh --only {{.S}} {{.D}}']

  device:check:
    desc: Plate size, hole map and asserts for one device (D=<name>), no geometry; EXTRA = more OpenSCAD args
    label: device-check-{{.D}}
    requires: { vars: [D] }
    silent: true
    vars:
      DIR: devices/{{.D}}
      F: devices/{{.D}}/{{.D}}.json
      ARGS:
        sh: "[ -f {{.F}} ] && jq -r --arg n {{.D}} '.parameterSets[$n] | to_entries | map(\"-D\", \"\\(.key)=\\(.value)\") | @sh' {{.F}} || true"
    preconditions:
      - sh: '[ -f {{.F}} ]'
        msg: 'No {{.F}}; create it with task device'
    cmds:
      - |
        echo 'Computing plate and hole map...'
        {{.OPENSCAD}} {{.ARGS}} {{.EXTRA}} -o {{.DIR}}/assembly.echo assembly.scad 2>/dev/null
        grep -E 'Assembly:|Map:|ERROR|WARNING' {{.DIR}}/assembly.echo | sed 's/^ECHO: "//; s/"$//; s/^Map: \?//'
        ! grep -qE 'ERROR|WARNING' {{.DIR}}/assembly.echo

  device:build:
    desc: Build one device (D=<name>) from devices/<name>/<name>.json into that directory
    label: device-{{.D}}
    requires: { vars: [D] }
    vars:
      DIR: devices/{{.D}}
      F: devices/{{.D}}/{{.D}}.json
      # answers as -D overrides: -p only sets the main file's own parameters, and the
      # device ones live in bracket.scad, which assembly.scad includes
      ARGS:
        sh: "[ -f {{.F}} ] && jq -r --arg n {{.D}} '.parameterSets[$n] | to_entries | map(\"-D\", \"\\(.key)=\\(.value)\") | @sh' {{.F}} || true"
    preconditions:
      - sh: '[ -f {{.F}} ]'
        msg: 'No {{.F}}; create it with task device'
    method: checksum
    sources: ['{{.F}}', assembly.scad, gearplate.scad, bracket.scad, opengrid-snap.scad, spec.py, .tools/openscad.version]
    generates: ['{{.DIR}}/assembly.3mf', '{{.DIR}}/assembly.png', '{{.DIR}}/plate.stl', '{{.DIR}}/caps.stl']  # not spec.png: optional
    cmds:
      # .echo first: fast, and shows the plate size and hole map or a failed assert before rendering
      - task: device:check
        vars: { D: '{{.D}}' }
      # coordinate drawing (holes, caps, margins, slots) from the Spec echo
      # optional: skipped with a note when python3 is missing (spec.py itself falls back to .svg)
      - { cmd: "echo 'Drawing spec.png...'", silent: true }
      - |
        if command -v python3 >/dev/null; then python3 spec.py {{.DIR}}/assembly.echo {{.DIR}}/spec.png {{.D}}
        else echo "skipping spec.png: python3 not found" >&2; fi
      - { cmd: "echo 'Rendering assembly.3mf...'", silent: true }
      - '{{.OPENSCAD}} {{.ARGS}} --enable=lazy-union -o {{.DIR}}/assembly.3mf assembly.scad'
      - { cmd: "echo 'Rendering assembly.png...'", silent: true }
      - '{{.OPENSCAD}} {{.ARGS}} -o {{.DIR}}/assembly.png --imgsize=1000,800 --viewall --autocenter --camera=0,0,0,55,0,25,0 assembly.scad'
      - { cmd: "echo 'Rendering plate.stl...'", silent: true }
      - '{{.OPENSCAD}} {{.ARGS}} -D ''part="plate"'' -o {{.DIR}}/plate.stl assembly.scad'
      - { cmd: "echo 'Rendering caps.stl...'", silent: true }
      - '{{.OPENSCAD}} {{.ARGS}} -o {{.DIR}}/caps.stl bracket.scad'

  custom:
    desc: One-off build with -D overrides (ARGS, NAME)
    cmds:
      - mkdir -p out
      - '{{.OPENSCAD}} {{.ARGS}} -o out/{{.NAME | default "custom"}}.stl gearplate.scad'

  images:
    desc: Render the README pictures into docs/
    cmds:
      - mkdir -p docs
      - |
        for fp in gearplate:4x4-mixed-slots gearplate:6x4-underware bracket:bracket-example bracket:bracket-top stacking:stacking snap:snap; do
          f=${fp%%:*} p=${fp#*:}
          {{.OPENSCAD}} -p $f.json -P $p --render --imgsize=800,600 --viewall --autocenter --colorscheme=Tomorrow -o docs/$p.png $f.scad
        done
      # coordinate diagram: the unifi-8-60w device with example margins and a slot
      - |
        mkdir -p out
        eval "set -- $(jq -r '.parameterSets["unifi-8-60w"] | to_entries | map("-D", "\(.key)=\(.value)") | @sh' devices/unifi-8-60w/unifi-8-60w.json)"
        {{.OPENSCAD}} "$@" -D margin_a=1 -D margin_b=1 -D margin_r=1 -D 'slot1=[3,1,10,1]' -o out/coordinates.echo assembly.scad 2>/dev/null
        command -v python3 >/dev/null || { echo "skipping docs/coordinates.png: python3 not found" >&2; exit 0; }
        python3 spec.py out/coordinates.echo docs/coordinates.png 'unifi-8-60w with margin_a = margin_b = margin_r = 1 and slot1 = [3, 1, 10, 1]'
      # preview mode keeps the part colours
      - '{{.OPENSCAD}} --imgsize=800,600 --viewall --autocenter --camera=0,0,0,55,0,25,0 --colorscheme=Tomorrow -o docs/assembly.png assembly.scad'

  test:
    desc: Run logic asserts (seam continuity, snap de-dup, slots, bracket grid, assembly, margins, stacking, snap)
    silent: true
    cmds:
      - mkdir -p out
      # .echo export needs no geometry, but exits 0 on failed asserts: grep for them
      - for: [seam, slots, bracket, assembly, margin, stacking, snap]
        cmd: |
          {{.OPENSCAD}} -o out/{{.ITEM}}.echo tests/{{.ITEM}}.scad 2>/dev/null
          cat out/{{.ITEM}}.echo
          ! grep -qE 'ERROR|WARNING' out/{{.ITEM}}.echo
      # spec.py parses the assembly's Spec echo (an edge-exit slot exercises the extensions)
      - |
        {{.OPENSCAD}} -D 'slot1=[2,7,5,-1]' -o out/spec.echo assembly.scad 2>/dev/null
        command -v python3 >/dev/null || { echo "SKIP spec (no python3)"; exit 0; }
        python3 spec.py out/spec.echo out/spec.svg test && grep -q 'slot1' out/spec.svg && echo 'PASS spec'

  setup:
    desc: Download latest OpenSCAD nightly (Manifold) and BOSL2 into .tools/
    silent: true
    preconditions:
      - sh: '[ "$(uname -sm)" = "Linux x86_64" ]'
        msg: setup only knows the Linux x86_64 AppImage; install OpenSCAD manually
    cmds:
      - mkdir -p .tools/libraries
      - |
        base=https://files.openscad.org/snapshots
        latest=$(curl -sfL $base/ | grep -oE 'OpenSCAD-[0-9.]+-x86_64\.AppImage' | sort -u | tail -1)
        [ -n "$latest" ] || { echo "no OpenSCAD snapshot found at $base" >&2; exit 1; }
        if [ "$(cat .tools/openscad.version 2>/dev/null)" = "$latest" ] && [ -x .tools/openscad ]; then
          echo "$latest already installed"
        else
          curl -fL --progress-bar -o .tools/openscad.part $base/$latest
          chmod +x .tools/openscad.part && mv .tools/openscad.part .tools/openscad
          echo "$latest" > .tools/openscad.version
        fi
      - |
        if [ -d .tools/libraries/BOSL2/.git ]; then git -C .tools/libraries/BOSL2 pull -q --ff-only
        else git clone -q --depth 1 https://github.com/BelfrySCAD/BOSL2 .tools/libraries/BOSL2; fi
        echo "BOSL2 $(git -C .tools/libraries/BOSL2 log -1 --format='%h %cs')"
      - .tools/openscad --version

  clean:
    desc: Remove build output
    cmds: [rm -rf out .task]
